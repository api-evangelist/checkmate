      operationIds, and tags.
- target: $
  update:
    x-agentic-access:
      list_brands:
        action-class: read
        consequence: read
        token-ttl-max: 3600
      generate_code:
        action-class: acting
        consequence: write
        token-ttl-max: 900
        audit: required
        note: >-
          Minting a working, merchant-backed discount code is a state-changing,
          revenue-affecting action; treat as a write with audit.
- target: $
  update:
